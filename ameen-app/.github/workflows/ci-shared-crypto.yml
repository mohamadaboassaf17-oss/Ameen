name: "Shared Crypto CI"

on:
  push:
    paths:
      - "shared-crypto/**"
  pull_request:
    paths:
      - "shared-crypto/**"

concurrency:
  group: shared-crypto-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci
        working-directory: shared-crypto

      - name: Build
        run: npm run build
        working-directory: shared-crypto

      - name: Lint
        run: npm run lint
        working-directory: shared-crypto

      - name: Test
        run: npm test
        working-directory: shared-crypto
